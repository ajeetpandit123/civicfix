# Render blueprint for CivicFix (see docs/deployment.md).
#
# Topology:
#   civicfix-web (Next.js) -- /api rewrite --> civicfix-api (Express)
#                                               |-- PostgreSQL (managed)
#                                               \-- Redis (job queue; the API
#                                                   falls back to in-process)
#   civicfix-worker (same image as the API, different start command)
#
# No secrets are hardcoded: the JWT secrets are generated by Render and the
# database/Redis connection strings come from the linked services. Deploy with
# `render blueprint launch` from the repo root.

databases:
  - name: civicfix-db
    databaseName: civicfix
    user: civicfix
    plan: starter

services:
  - type: web
    name: civicfix-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicfix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: civicfix-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      # Render web services receive traffic on port 10000.
      - key: API_PORT
        value: '10000'
      # Set these to the real HTTPS origins after the first deploy:
      #   API_PUBLIC_URL=https://civicfix-api.onrender.com
      #   WEB_ORIGIN=https://civicfix-web.onrender.com
      - key: API_PUBLIC_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Local-mode defaults; switch to s3 / smtp / openai and add the matching
      # S3_* / SMTP_* / AI_API_KEY variables for production use.
      - key: STORAGE_DRIVER
        value: local
      - key: EMAIL_DRIVER
        value: console
      - key: AI_PROVIDER
        value: mock
      - key: GEOCODER_PROVIDER
        value: nominatim
      - key: GEOCODER_USER_AGENT
        value: CivicFix/0.1 (https://github.com/your-org/civicfix)

  - type: worker
    name: civicfix-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    startCommand: node apps/api/dist/worker.js
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicfix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: civicfix-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: EMAIL_DRIVER
        value: console
      - key: AI_PROVIDER
        value: mock
      - key: GEOCODER_PROVIDER
        value: nominatim
      - key: GEOCODER_USER_AGENT
        value: CivicFix/0.1 (https://github.com/your-org/civicfix)

  # Next.js reads $PORT itself, so the web image's `next start` binds the port
  # Render assigns. /health and /api/* are rewritten to the API (next.config.ts).
  - type: web
    name: civicfix-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      # Server-side rewrite target for /api/* — set to the API's URL on first
      # deploy: https://civicfix-api.onrender.com
      - key: API_INTERNAL_URL
        sync: false

  # Job queue backend. Optional in development (in-process fallback), expected
  # in production so the API and worker share one queue.
  - type: redis
    name: civicfix-redis
    plan: starter
    ipAllowList: []
